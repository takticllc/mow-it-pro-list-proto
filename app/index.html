<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFFFFF">
  <title>Mow It · shipped hub (#114 / #116)</title>
  <link rel="stylesheet" href="hub.css">

</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="brandmark-svg" viewBox="0 0 112 112">
      <rect width="112" height="112" rx="25" fill="var(--DSColor-brandPrimary)"/>
      <g fill="none" stroke="var(--DSColor-textOnBrand)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M28 38h10a3 3 0 0 1 3 3v2"/>
        <path d="M31 43 L58 78"/>
        <path d="M50 74 h28 a8 8 0 0 1 8 8 v2 H54 a6 6 0 0 1-6-6z"/>
        <rect x="62" y="62" width="16" height="12" rx="3"/>
        <circle cx="50" cy="88" r="8"/>
        <circle cx="50" cy="88" r="3.2"/>
        <circle cx="80" cy="90" r="6"/>
        <circle cx="80" cy="90" r="2.4"/>
      </g>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 14 14">
      <path d="M2 2l10 10M12 2L2 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
  </svg>

  <div class="stage">
    <p class="caption">Mow It · #114 / #116 · disposable click-through · dropdown jumps the phone</p>

    <div class="proto-tools">
      <label class="proto-tools-label" for="screenJump">Proto screen</label>
      <select class="proto-select" id="screenJump">
        <optgroup label="Login">
          <option value="splash-client">Splash (client copy)</option>
          <option value="splash-pro">Splash (Sign up as a Pro)</option>
          <option value="email">Email sign-in / sign-up</option>
          <option value="forgot">Forgot password</option>
        </optgroup>
        <optgroup label="Client Home">
          <option value="pro-list-empty">Pro list empty</option>
          <option value="pro-list">Pro list (Pros)</option>
          <option value="booked-home">Booked Home</option>
          <option value="next-mow-detail">Next mow detail sheet</option>
          <option value="book-mow">Book a Mow</option>
          <option value="settings-client">Settings</option>
        </optgroup>
        <optgroup label="Pro Home">
          <option value="onboarding">Onboarding</option>
          <option value="pro-home">Pro Home</option>
          <option value="pro-home-empty">Pro Home empty</option>
          <option value="pro-home-stripe">Pro Home DEBUG Stripe</option>
          <option value="settings-pro">Settings</option>
          <option value="job-detail">Job detail (proposed)</option>
        </optgroup>
      </select>
    </div>

    <div class="phone">
      <div class="screen" id="screen">
        <div class="statusbar" aria-hidden="true">
          <span>9:41</span>
          <span class="statusbar-icons">
            <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="4.5" y="5" width="3" height="7" rx="0.6"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.6"/><rect x="13.5" y="0" width="3" height="12" rx="0.6"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.4c2.2 0 4.2.8 5.7 2.2l-1.1 1.1A6.4 6.4 0 0 0 8 4.1 6.4 6.4 0 0 0 3.4 5.7L2.3 4.6A8 8 0 0 1 8 2.4Zm0 3.3c1.3 0 2.5.5 3.4 1.3L10.3 8A3.2 3.2 0 0 0 8 7a3.2 3.2 0 0 0-2.3.9L4.6 7A4.8 4.8 0 0 1 8 5.7Zm0 3.3c.6 0 1.1.2 1.5.6L8 11.1 6.5 9.6c.4-.4.9-.6 1.5-.6Z"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="1" width="21" height="10" rx="2.2" stroke="currentColor" fill="none" stroke-width="1"/><rect x="2" y="2.5" width="16" height="7" rx="1.2" fill="currentColor"/><rect x="22.2" y="4" width="1.6" height="4" rx="0.6" fill="currentColor"/></svg>
          </span>
        </div>

        <!-- Login: Splash client -->
        <main class="pane splash" data-pane="splash-client">
          <div class="home-spacer"></div>
          <div class="splash-hero">
            <div class="brandmark-sm" aria-hidden="true"><svg viewBox="0 0 112 112"><use href="#brandmark-svg"/></svg></div>
            <h1 class="splash-name">Mow It</h1>
            <p class="splash-tag">Book a lawn mow in minutes.</p>
          </div>
          <div class="home-spacer"></div>
          <div class="splash-actions">
            <button class="btn-apple" type="button">
              <svg width="16" height="20" viewBox="0 0 16 20" fill="currentColor" aria-hidden="true"><path d="M12.8 10.6c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.3-.1-2.6.8-3.3.8-.7 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2.1-1.1 2.8-2.2c.9-1.3 1.2-2.5 1.2-2.6 0 0-2.3-.9-2.3-3.5zM10.8 4.3c.6-.8 1.1-1.9.9-3-1 .1-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.3-.6 3-1.5z"/></svg>
              Sign in with Apple
            </button>
            <button class="btn-secondary" type="button">
              <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
                <path fill="#EA4335" d="M10 4.4c1.5 0 2.9.5 4 1.5l3-3C15.2 1.1 12.8 0 10 0 6.1 0 2.7 2.2 1.1 5.4l3.5 2.7C5.5 6 7.6 4.4 10 4.4z"/>
                <path fill="#4285F4" d="M19.6 10.2c0-.7-.1-1.4-.2-2H10v3.8h5.4c-.2 1.2-1 2.3-2 3l3.2 2.5c1.9-1.7 3-4.3 3-7.3z"/>
                <path fill="#FBBC05" d="M4.6 12.1A6 6 0 0 1 4.2 10c0-.7.1-1.4.4-2.1L1.1 5.4A10 10 0 0 0 0 10c0 1.6.4 3.1 1.1 4.5l3.5-2.4z"/>
                <path fill="#34A853" d="M10 20c2.7 0 5-.9 6.7-2.4l-3.2-2.5c-.9.6-2.1 1-3.5 1-2.4 0-4.5-1.6-5.3-3.8L1.1 14.6C2.7 17.8 6.1 20 10 20z"/>
              </svg>
              Sign in with Google
            </button>
            <button class="btn-secondary" type="button" data-go="email">Sign in with email</button>
          </div>
          <button class="splash-toggle" type="button" data-go="splash-pro">Are you a pro? <strong>Sign up as a Pro</strong></button>
        </main>

        <!-- Login: Splash pro -->
        <main class="pane splash" data-pane="splash-pro">
          <div class="home-spacer"></div>
          <div class="splash-hero">
            <div class="brandmark-sm" aria-hidden="true"><svg viewBox="0 0 112 112"><use href="#brandmark-svg"/></svg></div>
            <h1 class="splash-name">Mow It</h1>
            <p class="splash-tag">Sign up to offer your services.</p>
          </div>
          <div class="home-spacer"></div>
          <div class="splash-actions">
            <button class="btn-apple" type="button">
              <svg width="16" height="20" viewBox="0 0 16 20" fill="currentColor" aria-hidden="true"><path d="M12.8 10.6c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.3-.1-2.6.8-3.3.8-.7 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2.1-1.1 2.8-2.2c.9-1.3 1.2-2.5 1.2-2.6 0 0-2.3-.9-2.3-3.5zM10.8 4.3c.6-.8 1.1-1.9.9-3-1 .1-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.3-.6 3-1.5z"/></svg>
              Sign up with Apple
            </button>
            <button class="btn-secondary" type="button">
              <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
                <path fill="#EA4335" d="M10 4.4c1.5 0 2.9.5 4 1.5l3-3C15.2 1.1 12.8 0 10 0 6.1 0 2.7 2.2 1.1 5.4l3.5 2.7C5.5 6 7.6 4.4 10 4.4z"/>
                <path fill="#4285F4" d="M19.6 10.2c0-.7-.1-1.4-.2-2H10v3.8h5.4c-.2 1.2-1 2.3-2 3l3.2 2.5c1.9-1.7 3-4.3 3-7.3z"/>
                <path fill="#FBBC05" d="M4.6 12.1A6 6 0 0 1 4.2 10c0-.7.1-1.4.4-2.1L1.1 5.4A10 10 0 0 0 0 10c0 1.6.4 3.1 1.1 4.5l3.5-2.4z"/>
                <path fill="#34A853" d="M10 20c2.7 0 5-.9 6.7-2.4l-3.2-2.5c-.9.6-2.1 1-3.5 1-2.4 0-4.5-1.6-5.3-3.8L1.1 14.6C2.7 17.8 6.1 20 10 20z"/>
              </svg>
              Sign up with Google
            </button>
            <button class="btn-secondary" type="button" data-go="email" data-email-mode="stabilize">Sign up with email</button>
          </div>
          <button class="splash-toggle" type="button" data-go="splash-client">Looking to book a service? <strong>Sign in as a client</strong></button>
        </main>
      </div>
    </div>
  </div>
</body>
</html>
