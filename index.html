<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFFFFF">
  <title>Mow It · Client pro list cell (#112)</title>
  <style>
    /* Live tokens from shared/design-tokens — named after DSColor / DSSpace / DSRadius / DSFont / DSSize */
    :root {
      --DSColor-brandPrimary: #339900;
      --DSColor-brandSecondary: #2B8000;
      --DSColor-bgCanvas: #FFFFFF;
      --DSColor-bgSurface: #FAFAFA;
      --DSColor-bgSurfaceRaised: #F5F5F5;
      --DSColor-textPrimary: #171717;
      --DSColor-textSecondary: #737373;
      --DSColor-textOnBrand: #FFFFFF;
      --DSColor-statusDanger: #EF4444;
      --DSColor-statusWarning: #EAB308;
      --DSColor-statusSuccess: #339900;
      --DSColor-borderDefault: #E5E5E5;

      --DSSpace-xxs: 2px;
      --DSSpace-xs: 4px;
      --DSSpace-sm: 8px;
      --DSSpace-md: 12px;
      --DSSpace-lg: 16px;
      --DSSpace-xl: 24px;
      --DSSpace-xxl: 32px;
      --DSSpace-xxxl: 40px;

      --DSRadius-sm: 4px;
      --DSRadius-md: 10px;
      --DSRadius-lg: 16px;
      --DSRadius-full: 9999px;

      --DSSize-controlHeight: 50px;
      --DSSize-controlMaxWidth: 375px;
      --DSSize-iconSm: 20px;
      --DSSize-iconLg: 40px;
      --DSSize-iconXl: 56px;

      --DSFont-sizeXs: 12px;
      --DSFont-sizeSm: 14px;
      --DSFont-sizeMd: 16px;
      --DSFont-sizeLg: 20px;
      --DSFont-sizeXl: 24px;
      --DSFont-sizeXxl: 34px;
      --DSFont-sizeHero: 56px;
      --DSFont-weightRegular: 400;
      --DSFont-weightMedium: 500;
      --DSFont-weightSemibold: 600;
      --DSFont-weightBold: 700;

      --phone-width: 390px;
      --phone-height: 844px;
      --brandmark-size: calc(var(--DSSize-iconXl) * 2);
      --brandmark-radius: calc(var(--brandmark-size) * 0.2237);
      --tap: 44px;
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-ui);
      background: #111;
      color: var(--DSColor-textPrimary);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    .stage {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      gap: 16px;
    }

    .caption {
      margin: 0;
      color: #a3a3a3;
      font-size: 13px;
      letter-spacing: 0.01em;
      text-align: center;
    }

    .proto-tools {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .proto-tools-label {
      color: #737373;
      font-size: 12px;
    }

    .proto-toggle {
      appearance: none;
      border: 1px solid #404040;
      background: #1a1a1a;
      color: #d4d4d4;
      font-family: inherit;
      font-size: 13px;
      min-height: var(--tap);
      min-width: var(--tap);
      padding: 0 14px;
      border-radius: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .proto-toggle[aria-pressed="true"] {
      border-color: #339900;
      color: #ffffff;
      background: #1f2e14;
    }

    .proto-toggle:active { filter: brightness(1.15); }
    .proto-toggle:focus-visible {
      outline: 2px solid var(--DSColor-brandPrimary);
      outline-offset: 2px;
    }

    .phone {
      width: var(--phone-width);
      height: var(--phone-height);
      max-width: 100%;
      background: #0a0a0a;
      border-radius: 48px;
      padding: 12px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--DSColor-bgCanvas);
      border-radius: 36px;
      overflow: hidden;
      isolation: isolate;
    }

    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 54px;
      padding: 14px 28px 0;
      font-size: 15px;
      font-weight: var(--DSFont-weightSemibold);
      color: var(--DSColor-textPrimary);
      pointer-events: none;
    }

    .statusbar-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .home {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: calc(100% - 54px);
      padding: 0 var(--DSSpace-lg);
    }

    .brandmark {
      width: var(--brandmark-size);
      height: var(--brandmark-size);
      border-radius: var(--brandmark-radius);
      overflow: hidden;
      margin-top: var(--DSSpace-sm);
      flex-shrink: 0;
    }

    .brandmark svg { display: block; width: 100%; height: 100%; }

    .pane {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .pane[hidden] { display: none; }

    .home-title {
      margin: var(--DSSpace-lg) 0 0;
      font-size: var(--DSFont-sizeMd);
      font-weight: var(--DSFont-weightSemibold);
      line-height: 1.25;
      color: var(--DSColor-textPrimary);
    }

    .pro-list {
      display: flex;
      flex-direction: column;
      width: 100%;
      margin-top: var(--DSSpace-lg);
      gap: var(--DSSpace-sm);
      overflow: auto;
      min-height: 0;
    }

    .pro-row {
      display: block;
      width: 100%;
      padding: var(--DSSpace-lg);
      border: 0;
      border-radius: var(--DSRadius-lg);
      background: var(--DSColor-bgSurfaceRaised);
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      min-height: var(--tap);
      font-family: inherit;
    }

    .pro-row:active { filter: brightness(0.97); }
    .pro-row:focus-visible {
      outline: 2px solid var(--DSColor-brandPrimary);
      outline-offset: 2px;
    }

    .pro-title {
      display: block;
      margin: 0;
      font-size: var(--DSFont-sizeMd);
      font-weight: var(--DSFont-weightSemibold);
      color: var(--DSColor-textPrimary);
      line-height: 1.3;
    }

    .pro-name,
    .pro-itid,
    .pro-services {
      display: block;
      margin: var(--DSSpace-sm) 0 0;
      font-size: var(--DSFont-sizeSm);
      font-weight: var(--DSFont-weightRegular);
      color: var(--DSColor-textSecondary);
      line-height: 1.3;
    }

    .pro-services {
      overflow-wrap: anywhere;
    }

    .empty-copy {
      margin: var(--DSSpace-lg) 0 0;
      font-size: var(--DSFont-sizeMd);
      font-weight: var(--DSFont-weightSemibold);
      line-height: 1.25;
      color: var(--DSColor-textPrimary);
      text-align: center;
    }

    .note-copy {
      margin: var(--DSSpace-lg) 0 0;
      width: 100%;
      font-size: var(--DSFont-sizeMd);
      font-weight: var(--DSFont-weightRegular);
      line-height: 1.4;
      color: var(--DSColor-textPrimary);
      text-align: center;
    }

    .note-back {
      appearance: none;
      border: 0;
      background: none;
      margin-top: var(--DSSpace-xl);
      color: var(--DSColor-brandPrimary);
      font-family: inherit;
      font-size: var(--DSFont-sizeMd);
      font-weight: var(--DSFont-weightRegular);
      min-height: var(--tap);
      min-width: var(--tap);
      padding: 0 var(--DSSpace-lg);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .note-back:active { opacity: 0.55; }
    .note-back:focus-visible {
      outline: 2px solid var(--DSColor-brandPrimary);
      outline-offset: 2px;
      border-radius: var(--DSRadius-full);
    }

    .home-spacer { flex: 1; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--DSSpace-lg);
      padding-bottom: calc(var(--DSSpace-xl) + 18px);
    }

    .footer-item {
      appearance: none;
      border: 0;
      background: none;
      color: var(--DSColor-brandPrimary);
      font-family: inherit;
      font-size: var(--DSFont-sizeMd);
      font-weight: var(--DSFont-weightRegular);
      min-height: var(--tap);
      min-width: var(--tap);
      padding: 0 var(--DSSpace-sm);
      cursor: default;
      pointer-events: none;
    }

    .home-indicator {
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 134px;
      height: 5px;
      margin-left: -67px;
      border-radius: var(--DSRadius-full);
      background: var(--DSColor-textPrimary);
      opacity: 0.18;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .stage { padding: 12px 0 0; gap: 10px; }
      .caption { padding: 0 16px; }
      .phone {
        width: 100%;
        height: calc(100dvh - 120px);
        max-width: none;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }
      .screen { border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="caption">Mow It · #112 · disposable click-through · tap a pro</p>

    <div class="proto-tools" role="group" aria-label="Proto list state">
      <span class="proto-tools-label">Proto</span>
      <button type="button" class="proto-toggle" id="toggleList" aria-pressed="true">List</button>
      <button type="button" class="proto-toggle" id="toggleEmpty" aria-pressed="false">Empty</button>
    </div>

    <div class="phone">
      <div class="screen" id="screen">
        <div class="statusbar" aria-hidden="true">
          <span>9:41</span>
          <span class="statusbar-icons">
            <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="4.5" y="5" width="3" height="7" rx="0.6"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.6"/><rect x="13.5" y="0" width="3" height="12" rx="0.6"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.4c2.2 0 4.2.8 5.7 2.2l-1.1 1.1A6.4 6.4 0 0 0 8 4.1 6.4 6.4 0 0 0 3.4 5.7L2.3 4.6A8 8 0 0 1 8 2.4Zm0 3.3c1.3 0 2.5.5 3.4 1.3L10.3 8A3.2 3.2 0 0 0 8 7a3.2 3.2 0 0 0-2.3.9L4.6 7A4.8 4.8 0 0 1 8 5.7Zm0 3.3c.6 0 1.1.2 1.5.6L8 11.1 6.5 9.6c.4-.4.9-.6 1.5-.6Z"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="1" width="21" height="10" rx="2.2" stroke="currentColor" fill="none" stroke-width="1"/><rect x="2" y="2.5" width="16" height="7" rx="1.2" fill="currentColor"/><rect x="22.2" y="4" width="1.6" height="4" rx="0.6" fill="currentColor"/></svg>
          </span>
        </div>

        <main class="home">
          <div class="brandmark" aria-hidden="true">
            <svg viewBox="0 0 112 112" role="img" aria-label="Mow It">
              <rect width="112" height="112" rx="25" fill="var(--DSColor-brandPrimary)"/>
              <g fill="none" stroke="var(--DSColor-textOnBrand)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M28 38h10a3 3 0 0 1 3 3v2"/>
                <path d="M31 43 L58 78"/>
                <path d="M50 74 h28 a8 8 0 0 1 8 8 v2 H54 a6 6 0 0 1-6-6z"/>
                <rect x="62" y="62" width="16" height="12" rx="3"/>
                <circle cx="50" cy="88" r="8"/>
                <circle cx="50" cy="88" r="3.2"/>
                <circle cx="80" cy="90" r="6"/>
                <circle cx="80" cy="90" r="2.4"/>
              </g>
            </svg>
          </div>

          <div class="pane" id="paneList">
            <h1 class="home-title">Pros</h1>
            <div class="pro-list" role="list">
              <button class="pro-row" type="button" role="listitem" data-pro="Tims lawn care" aria-label="Tims lawn care, Tim Parmentier, IT-77C9DF12, Edging, Fertilizing, Lawn Mowing, Leaf Blowing, Trimming">
                <span class="pro-title">Tims lawn care</span>
                <span class="pro-name">Tim Parmentier</span>
                <span class="pro-itid">IT-77C9DF12</span>
                <span class="pro-services">Edging, Fertilizing, Lawn Mowing, Leaf Blowing, Trimming</span>
              </button>
              <button class="pro-row" type="button" role="listitem" data-pro="Greenway Lawn" aria-label="Greenway Lawn, IT-18A4B2C0, Lawn Mowing, Trimming">
                <span class="pro-title">Greenway Lawn</span>
                <span class="pro-itid">IT-18A4B2C0</span>
                <span class="pro-services">Lawn Mowing, Trimming</span>
              </button>
              <button class="pro-row" type="button" role="listitem" data-pro="mow-it-pro-18" aria-label="mow-it-pro-18">
                <span class="pro-title">mow-it-pro-18</span>
              </button>
            </div>
            <div class="home-spacer"></div>
          </div>

          <div class="pane" id="paneEmpty" hidden>
            <p class="empty-copy">No pros yet.</p>
            <div class="home-spacer"></div>
          </div>

          <div class="pane" id="paneNote" hidden>
            <p class="note-copy" id="noteCopy">Book a Mow stays as shipped: address → when → extras → confirm.</p>
            <button class="note-back" type="button" id="noteBack">Back</button>
            <div class="home-spacer"></div>
          </div>

          <div class="footer">
            <span class="footer-item">Settings</span>
            <span class="footer-item">Sign Out</span>
          </div>
        </main>

        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var paneList = document.getElementById("paneList");
      var paneEmpty = document.getElementById("paneEmpty");
      var paneNote = document.getElementById("paneNote");
      var noteCopy = document.getElementById("noteCopy");
      var noteBack = document.getElementById("noteBack");
      var toggleList = document.getElementById("toggleList");
      var toggleEmpty = document.getElementById("toggleEmpty");
      var listState = "list";

      function showPane(pane) {
        paneList.hidden = pane !== paneList;
        paneEmpty.hidden = pane !== paneEmpty;
        paneNote.hidden = pane !== paneNote;
      }

      function setToggles(empty) {
        toggleList.setAttribute("aria-pressed", empty ? "false" : "true");
        toggleEmpty.setAttribute("aria-pressed", empty ? "true" : "false");
      }

      function showList() {
        listState = "list";
        showPane(paneList);
        setToggles(false);
      }

      function showEmpty() {
        listState = "empty";
        showPane(paneEmpty);
        setToggles(true);
      }

      function showNote(name) {
        noteCopy.textContent = name + " — Book a Mow stays as shipped: address → when → extras → confirm.";
        showPane(paneNote);
        noteBack.focus();
      }

      toggleList.addEventListener("click", showList);
      toggleEmpty.addEventListener("click", showEmpty);
      noteBack.addEventListener("click", function () {
        if (listState === "empty") showEmpty();
        else showList();
      });

      Array.prototype.forEach.call(document.querySelectorAll(".pro-row"), function (row) {
        row.addEventListener("click", function () {
          showNote(row.getAttribute("data-pro"));
        });
      });
    })();
  </script>
</body>
</html>
